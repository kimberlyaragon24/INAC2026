<canvas id="game"></canvas>

// ===================================================================
//  LA VASIJA — Parkour temático de Hollow Knight
//  3 niveles: salta entre plataformas, esquiva pinchos y sombras
//  enemigas, y no caigas al vacío. Junta los orbes para avanzar.
// ===================================================================
const VW = 900, VH = 420;             // tamaño de la "cámara" (canvas)
const SPEED = 4.3, GRAV = 0.62, JUMP = -12.8, FSC = 0.42;
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
cv.width = VW; cv.height = VH; ctx.imageSmoothingEnabled = false;

const knight = new Image(); let ready = false, failed = false;
const FW = 80, FH = 100;
let shadowSprite = null; // versión "sombra" (silueta oscura) para los enemigos
knight.onload = () => {
  ready = true;
  const oc = document.createElement('canvas'); oc.width = knight.width; oc.height = knight.height;
  const octx = oc.getContext('2d');
  octx.drawImage(knight, 0, 0);
  octx.globalCompositeOperation = 'source-atop';
  octx.fillStyle = '#0b0710';
  octx.fillRect(0, 0, oc.width, oc.height);
  octx.globalCompositeOperation = 'source-over';
  // brillo tenue en los ojos para que la sombra no sea una mancha plana
  shadowSprite = oc;
};
knight.onerror = () => { failed = true; };

// =========================== SONIDO ==================================
// Todo se sintetiza con Web Audio (sin archivos externos). El audio se
// activa con la primera tecla que presiones (regla de los navegadores).
let AC = null, master = null, muted = false;
function audioInit() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination); Music.start();
  } catch (e) { AC = null; }
}
function tone(freq, dur, type, vol, when, slideTo) {
  if (!AC || muted) return;
  const t = AC.currentTime + (when || 0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.03);
}
function noise(dur, vol, when, fStart, fEnd) {
  if (!AC || muted) return;
  const t = AC.currentTime + (when || 0);
  const len = Math.max(1, Math.floor(AC.sampleRate * dur));
  const buf = AC.createBuffer(1, len, AC.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  const src = AC.createBufferSource(); src.buffer = buf;
  const f = AC.createBiquadFilter(); f.type = 'lowpass';
  f.frequency.setValueAtTime(fStart || 2000, t);
  f.frequency.exponentialRampToValueAtTime(fEnd || 300, t + dur);
  const g = AC.createGain();
  g.gain.setValueAtTime(vol || 0.3, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f); f.connect(g); g.connect(master); src.start(t);
}

    melody: [[[0, 74, 3], [3, 70, 1], [4, 67, 4]], [[0, 72, 3], [3, 68, 1], [4, 75, 4]], [[0, 72, 2], [2, 74, 2], [4, 77, 4]], [[0, 74, 4], [4, 70, 2], [6, 67, 2]],

const Music = (() => {

    g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(vol, t + .9);
    g.gain.setValueAtTime(vol, t + dur - 1.4); g.gain.linearRampToValueAtTime(.0001, t + dur);

  }

  function build() {

})();

// =========================== ESTADO ==================================
let lvl = 0, L, coins, got, total, movers, enemies, state = 'play', timer = 0, deaths = 0, tick = 0, cam = 0, deco = [], flash = 0, SOL = [];
const ink = [];                        // gotas de tinta (partículas)
const ATK_FRAMES = 12, ATK_COOLDOWN = 20, INHERIT = 0.85;
const PLAYER_INK = '#050308', PLAYER_RIM = '#f0f0ff';
const ENEMY_INK = '#140a24', ENEMY_RIM = '#9b7be0';
const p = { x: 0, y: 0, w: 22, h: 34, vx: 0, vy: 0, ix: 0, ground: false, face: 1, coyote: 0, buf: 0, extra: true, wings: 0, onMover: null, atk: 0, atkCd: 0, atkFace: 1 };
const keys = {};

function load(n) {
  lvl = n; L = LEVELS[n]; Music.setLevel(n);
  coins = L.coins.map(([x, y]) => ({ x, y, on: true }));
  total = coins.length;
  // fase fija (no aleatoria) para que cada nivel arranque siempre igual
  movers = L.movers.map((m, i) => {
    const t = i * 1.7, off = Math.sin(t) * m.range;
    return { ...m, t, x0: m.x, y0: m.y, x: m.axis === 'x' ? m.x + off : m.x, y: m.axis === 'y' ? m.y + off : m.y, dx: 0, dy: 0 };
  });
  SOL = solids();
  ink.length = 0;
  state = 'play'; respawn();
  // decoración de fondo procedural, distinta por nivel pero fija (semilla)
  let s = 11 + n * 97; const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  deco = { far: [], near: [], motes: [] };
  for (let i = 0; i < 14; i++) deco.far.push({ x: rnd() * L.W, w: 60 + rnd() * 90, h: 60 + rnd() * 140 });
  for (let i = 0; i < 20; i++) deco.near.push({ x: rnd() * L.W, w: 18 + rnd() * 22, h: 30 + rnd() * 60 });
  for (let i = 0; i < 28; i++) deco.motes.push({ x: rnd() * L.W, y: 20 + rnd() * (L.groundY - 20), s: 1 + rnd() * 2, ph: rnd() * 10 });
}
function respawn() {
  p.x = L.start[0]; p.y = L.start[1]; p.vx = p.vy = p.ix = 0; p.ground = false; p.extra = true; p.wings = 0; p.onMover = null; p.atk = p.atkCd = 0;
  coins.forEach(c => c.on = true); got = 0;
  enemies = L.enemies.map(e => ({ ...e, x: (e.x0 + e.x1) / 2, dir: 1, w: 20, h: 30 }));
}
function solids() {
  const arr = L.platforms.map(r => ({ r, mv: null }));
  movers.forEach(m => arr.push({ r: [m.x, m.y, m.w, m.h], mv: m }));
  return arr;
}
function hit(x, y) {
  for (const { r } of SOL)
    if (x < r[0] + r[2] && x + p.w > r[0] && y < r[1] + r[3] && y + p.h > r[1]) return true;
  return false;
}
function moveAxis(axis, d) {
  const s = Math.sign(d); let rem = Math.abs(d);
  while (rem > 0) {
    const st = Math.min(1, rem) * s;
    if (axis === 'x') { if (hit(p.x + st, p.y)) { p.vx = 0; p.ix = 0; break; } p.x += st; }
    else {
      if (hit(p.x, p.y + st)) {
        if (s > 0) p.ground = true;
        p.vy = 0; break;
      }
      p.y += st;
    }
    rem -= 1;

}

// ---------------------------- tinta ----------------------------------
function splat(x, y, n, col, rim) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 1 + Math.random() * 6.5;
    ink.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 3.5,
      r: 1.6 + Math.random() * (i < n / 4 ? 5.5 : 3),
      life: 90 + Math.random() * 50, col, rim, stuck: false, mv: null, ox: 0, oy: 0,
    });
  }
}
function updateInk() {
  for (let i = ink.length - 1; i >= 0; i--) {
    const d = ink[i];
    if (--d.life <= 0 || d.y > L.groundY + 320) { ink.splice(i, 1); continue; }
    if (d.stuck) continue;
    d.vy = Math.min(d.vy + 0.36, 12); d.vx *= 0.992;
    const nx = d.x + d.vx, ny = d.y + d.vy;
    let blocked = false;
    for (const { r, mv } of SOL) {
      if (nx > r[0] && nx < r[0] + r[2] && ny >= r[1] && ny < r[1] + r[3]) {
        if (d.y <= r[1] + 1 && d.vy > 0) {
          // cae encima de una plataforma: queda pegada como mancha
          d.stuck = true; d.x = nx; d.y = r[1]; d.life = 110 + Math.random() * 70;
          if (mv) { d.mv = mv; d.ox = d.x - mv.x; d.oy = d.y - mv.y; }
        } else { d.vx *= -0.3; d.vy *= 0.5; }
        blocked = true; break;
      }
    }
    if (!blocked) { d.x = nx; d.y = ny; }
  }
}

// ----------------------- muertes y espadazo ---------------------------
function die() {
  if (state !== 'play') return;
  deaths++; flash = 70; state = 'dead'; timer = 42;
  splat(p.x + p.w / 2, p.y + p.h / 2, 42, PLAYER_INK, PLAYER_RIM);
  SFX.playerDie(); Music.duck(1.1);
}
function swordBox() {
  const cx = p.x + p.w / 2, w = 58;
  return { x: p.atkFace > 0 ? cx : cx - w, y: p.y - 10, w, h: p.h + 18 };
}
function startAttack() {
  if (state !== 'play' || p.atkCd > 0) return;
  p.atk = ATK_FRAMES; p.atkCd = ATK_COOLDOWN; p.atkFace = p.face;
  SFX.slash();
}

// Avanza todo lo que no depende del jugador: plataformas, sombras, tinta.
function worldStep() {
  movers.forEach(m => {
    const ox = m.x, oy = m.y;
    m.t += m.speed * 0.03;
    const off = Math.sin(m.t) * m.range;
    m.x = m.axis === 'x' ? m.x0 + off : m.x0;
    m.y = m.axis === 'y' ? m.y0 + off : m.y0;
    m.dx = m.x - ox; m.dy = m.y - oy;   // cuánto se movió en este cuadro
  });
  SOL = solids();
  enemies.forEach(e => {
    e.x += e.dir * e.speed;
    if (e.x < e.x0) { e.x = e.x0; e.dir = 1; }
    if (e.x > e.x1) { e.x = e.x1; e.dir = -1; }
  });
  updateInk();
  if (p.atkCd > 0) p.atkCd--;
  if (p.atk > 0) p.atk--;
}

function update() {
  tick++;
  if (flash > 0) flash--;
  worldStep();
  if (state === 'win') { if (keys.Enter) { deaths = 0; load(0); } return; }
  if (state === 'next') { if (--timer <= 0) load(lvl + 1); return; }
  if (state === 'dead') { if (--timer <= 0) { respawn(); state = 'play'; } return; }

  // --- 1) si va montado en una plataforma móvil, se lo lleva con ella ---
  // (se compara contra la posición ANTERIOR de la plataforma, así no se
  //  "suelta" al pararse en el borde de una plataforma rápida)
  if (p.onMover) {
    const m = p.onMover, px = m.x - m.dx;
    if (p.x + p.w > px && p.x < px + m.w) {
      p.y = m.y - p.h; p.vy = 0; p.ground = true;   // pegado a la cara superior (sube o baja)
      moveAxis('x', m.dx);                          // arrastre horizontal, respetando paredes
      if (hit(p.x, p.y)) { die(); return; }         // aplastado contra un techo
    } else p.onMover = null;
  }

  // --- 2) una plataforma que te alcanza desde un costado, por arriba o por abajo ---
  for (const m of movers) {
    if (p.onMover === m) continue;
    const ox = Math.min(p.x + p.w, m.x + m.w) - Math.max(p.x, m.x);
    const oy = Math.min(p.y + p.h, m.y + m.h) - Math.max(p.y, m.y);
    if (ox <= 0 || oy <= 0) continue;
    if (ox < oy) {                                   // empujón lateral
      p.x += (p.x + p.w / 2 < m.x + m.w / 2) ? -ox : ox; p.vx = 0; p.ix = 0;
    } else if (p.y + p.h / 2 < m.y + m.h / 2) {      // te levanta: quedas parado encima
      p.y -= oy; p.vy = 0; p.ground = true;
    } else {                                         // te golpea desde arriba
      p.y += oy; if (p.vy < 0) p.vy = 0;
    }
    if (hit(p.x, p.y)) { die(); return; }            // quedó aplastado contra algo sólido
  }

  else if (pressed && !p.ground && p.extra) { p.vy = JUMP * 0.9; p.extra = false; p.buf = 0; p.wings = 25; p.onMover = null; }

        splat(e.x, e.y - e.h / 2, 26, ENEMY_INK, ENEMY_RIM);

  if (got === total && p.x + p.w > L.goal[0]) {
    if (lvl + 1 < LEVELS.length) { state = 'next'; timer = 80; SFX.level(); Music.duck(1.6); }

}

// ============================ DIBUJO =================================
function drawPlatform(x, y, w, h, moving) {
  ctx.fillStyle = L.tile; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = L.top; ctx.fillRect(x, y, w, 5);
  ctx.fillStyle = L.dark;
  for (let i = 0; i < w; i += 16) ctx.fillRect(x + i + 3, y + 12, 7, 6);
  if (moving) { ctx.fillStyle = 'rgba(255,255,255,.3)'; ctx.fillRect(x, y, w, 2); ctx.fillRect(x, y + h - 2, w, 2); }
}
function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, L.bg); g.addColorStop(1, L.bg2);
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);

  ctx.fillStyle = L.bg2;
  deco.far.forEach(d => {
    const sx = d.x - cam * 0.25;
    const bx = ((sx % (L.W + VW)) + L.W + VW) % (L.W + VW) - VW / 2;
    ctx.beginPath();
    ctx.moveTo(bx, L.groundY + 40);
    ctx.lineTo(bx, L.groundY + 40 - d.h);
    ctx.quadraticCurveTo(bx + d.w / 2, L.groundY + 40 - d.h - 18, bx + d.w, L.groundY + 40 - d.h);
    ctx.lineTo(bx + d.w, L.groundY + 40);
    ctx.fill();
  });
  ctx.fillStyle = L.dark;
  deco.near.forEach(d => {
    const sx = d.x - cam * 0.55;
    const bx = ((sx % (L.W + VW)) + L.W + VW) % (L.W + VW) - VW / 2;
    ctx.fillRect(bx, L.groundY - d.h, d.w, d.h);
  });
  // niebla baja cerca del piso, para dar profundidad
  const fog = ctx.createLinearGradient(0, L.groundY - 70, 0, L.groundY + 40);
  fog.addColorStop(0, 'rgba(0,0,0,0)'); fog.addColorStop(1, L.bg2);
  ctx.fillStyle = fog; ctx.fillRect(0, L.groundY - 70, VW, 110);

  ctx.fillStyle = L.accent;
  deco.motes.forEach(d => {
    const sx = d.x - cam * 0.85;
    const bx = ((sx % (L.W + VW)) + L.W + VW) % (L.W + VW) - VW / 2;
    const by = d.y + Math.sin(tick / 40 + d.ph) * 10;
    ctx.globalAlpha = 0.35 + 0.25 * Math.sin(tick / 30 + d.ph);
    ctx.fillRect(bx, by, d.s, d.s);
  });
  ctx.globalAlpha = 1;
}
function vignette() {
  const g = ctx.createRadialGradient(VW / 2, VH / 2, VH * 0.35, VW / 2, VH / 2, VH * 0.85);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.45)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
}
// Dibuja un cuadro del sprite en una posición del MUNDO, redondeando a
// pixeles enteros para que el escalado "pixelado" no genere destellos
// ni pixeles sueltos al moverse (temblor de sub-pixel).

  const dw = Math.round(FW * scale), dh = Math.round(FH * scale);
  const dx = Math.round(wx) - (face > 0 ? Math.round(dw / 2) : dw - Math.round(dw / 2));
  const dy = Math.round(wy) - dh;
  ctx.save();
  ctx.translate(dx + dw / 2, 0); ctx.scale(face, 1); ctx.translate(-dw / 2, 0);
  ctx.drawImage(img, frame * FW, 0, FW, FH, 0, dy, dw, dh);
  ctx.restore();
}
// Posición (en el cuadro del sprite) del ojo izquierdo de cada cuadro de animación;
// el ojo derecho queda 10.5 px a su derecha. Medido sobre la imagen del sprite.
const EYES = [[47, 47], [46, 46.5], [47, 46], [49, 46], [48, 46], [46.3, 46], [47, 47]];
// Convierte un punto del cuadro del sprite a coordenadas del mundo (respeta escala y giro).
function spritePt(lx, ly, wx, wy, face, scale) {
  const dw = Math.round(FW * scale), dh = Math.round(FH * scale);
  const dx = Math.round(wx) - (face > 0 ? Math.round(dw / 2) : dw - Math.round(dw / 2));
  const dy = Math.round(wy) - dh;
  return [dx + dw / 2 + face * (lx * scale - dw / 2), dy + ly * scale];
}
function drawInk() {
  for (const d of ink) {
    let x = d.x, y = d.y;
    if (d.stuck && d.mv) { x = d.mv.x + d.ox; y = d.mv.y + d.oy; }
    ctx.globalAlpha = Math.max(0, Math.min(1, d.life / 40));
    ctx.fillStyle = d.col; ctx.strokeStyle = d.rim; ctx.lineWidth = 1;
    ctx.beginPath();
    if (d.stuck) ctx.ellipse(Math.round(x), Math.round(y) - d.r * 0.25, d.r * 1.9, d.r * 0.55, 0, 0, 7);
    else ctx.ellipse(x, y, d.r * (1 + Math.min(1.2, Math.hypot(d.vx, d.vy) * 0.12)), d.r, Math.atan2(d.vy, d.vx), 0, 7);
    ctx.fill(); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}
function drawSlash() {
  if (p.atk <= 0) return;
  const t = 1 - p.atk / ATK_FRAMES;                 // 0 → 1 durante el golpe
  const f = p.atkFace, A = 0.9 + 0.5 * t, R = 40, c = 22;
  const cx = p.x + p.w / 2 + f * (8 + 16 * t), cy = p.y + p.h * 0.45;
  const ex = R * Math.cos(A), ey = R * Math.sin(A);
  ctx.save();
  ctx.translate(Math.round(cx), Math.round(cy)); ctx.scale(f, 1);
  ctx.globalAlpha = Math.max(0, 1 - t * t);
  ctx.fillStyle = '#f4f8ff'; ctx.shadowColor = '#9fd4ff'; ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.arc(0, 0, R, -A, A);                                        // borde exterior de la media luna
  ctx.arc(-c, 0, Math.hypot(ex + c, ey), Math.atan2(ey, ex + c), -Math.atan2(ey, ex + c), true); // borde interior
  ctx.closePath(); ctx.fill();
  ctx.restore();
}
// orbe: racimo de bultos gris azulados con borde negro grueso
function drawOrb(x, y) {
  ctx.fillStyle = '#05060a'; ctx.beginPath(); ctx.arc(x, y, 14, 0, 7); ctx.fill();
  const lump = (dx, dy, rx, ry, rot) => {
    const cx = x + dx, cy = y + dy;
    ctx.fillStyle = '#7f97a8'; ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, rot, 0, 7); ctx.fill();
    ctx.fillStyle = '#c9dae6'; ctx.beginPath(); ctx.ellipse(cx - rx * .15, cy - ry * .2, rx * .72, ry * .68, rot, 0, 7); ctx.fill();
    ctx.fillStyle = '#eef6fb'; ctx.beginPath(); ctx.ellipse(cx - rx * .3, cy - ry * .45, rx * .35, ry * .25, rot, 0, 7); ctx.fill();
  };
  for (let i = 0; i < 7; i++) { const a = i * Math.PI * 2 / 7 - 1.2; lump(Math.cos(a) * 8.6, Math.sin(a) * 8.6, 4.4, 3.3, a); }
  lump(-2.6, 0, 3.4, 4.4, .15); lump(3.2, -.5, 3.2, 4.2, -.2);
}

function draw() {
  drawBackground();
  ctx.save(); ctx.translate(-Math.round(cam), 0);

  L.platforms.forEach(([x, y, w, h]) => drawPlatform(x, y, w, h, false));
  movers.forEach(m => drawPlatform(Math.round(m.x), Math.round(m.y), m.w, m.h, true));

  ctx.fillStyle = '#d8d8e0';
  L.spikes.forEach(([x, y, w, h]) => {
    for (let sx = x; sx < x + w; sx += 14) { ctx.beginPath(); ctx.moveTo(sx, y + h); ctx.lineTo(sx + 7, y); ctx.lineTo(sx + 14, y + h); ctx.fill(); }
  });

  // banco gris (meta): se ilumina cuando ya tienes todas las monedas
  const gx = L.goal[0], gy = L.groundY, on = got === total;
  const bc = on ? '#b8b8c4' : '#6e6e78', bd = on ? '#8a8a96' : '#4a4a52';
  if (on) { ctx.shadowColor = 'rgba(255,224,102,.8)'; ctx.shadowBlur = 14; }
  ctx.fillStyle = bd; ctx.fillRect(gx + 6, gy - 18, 6, 18); ctx.fillRect(gx + 52, gy - 18, 6, 18);
  ctx.fillStyle = bc; ctx.fillRect(gx, gy - 24, 64, 7);
  ctx.strokeStyle = bc; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(gx + 4, gy - 24); ctx.quadraticCurveTo(gx + 32, gy - 62, gx + 60, gy - 24); ctx.stroke();
  ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(gx + 32, gy - 24); ctx.lineTo(gx + 32, gy - 43); ctx.stroke();
  ctx.beginPath(); ctx.arc(gx + 32, gy - 47, 4, 0, 7); ctx.fill();
  ctx.shadowBlur = 0; ctx.lineCap = 'butt';

  coins.forEach(c => {
    if (!c.on) return;
    const y = c.y + Math.sin(tick / 15 + c.x) * 4;
    drawOrb(c.x, y);
  });

  drawInk();

  // sombras enemigas — mismo sprite que la vasija teñido oscuro, con ojos blancos
  enemies.forEach(e => {
    ctx.fillStyle = 'rgba(0,0,0,.4)';
    ctx.beginPath(); ctx.ellipse(Math.round(e.x), e.y + 3, 11, 4, 0, 0, 7); ctx.fill();
    const ef = Math.floor(tick / 5 + e.x) % 7, sc = FSC * 0.95;
    if (shadowSprite) drawSprite(shadowSprite, ef, e.x, e.y + 2, e.dir, sc);
    const [lx, ly] = EYES[ef];
    ctx.fillStyle = '#ffffff'; ctx.shadowColor = 'rgba(255,255,255,.9)'; ctx.shadowBlur = 3;
    for (const off of [0, 10.5]) {
      const [ex, ey] = spritePt(lx + off, ly, e.x, e.y + 2, e.dir, sc);
      ctx.beginPath(); ctx.ellipse(ex, ey, 1.7, 2.7, 0, 0, 7); ctx.fill();
    }
    ctx.shadowBlur = 0;
  });

  if (state !== 'dead') {
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.beginPath(); ctx.ellipse(Math.round(p.x + p.w / 2), p.y + p.h + 3, 12, 4, 0, 0, 7); ctx.fill();

    let f = 7;
    if (!p.ground) f = p.wings > 0 || p.vy < 0 ? 9 : 10 + (Math.floor(tick / 6) % 3);
    else if (p.vx) f = Math.floor(tick / 5) % 7;
    if (ready) drawSprite(knight, f, p.x + p.w / 2, p.y + p.h + 2, p.face, FSC);
    drawSlash();
  }

  ctx.restore(); // fin de cámara
  vignette();

  // mensaje breve al morir
  if (flash > 0 && (state === 'play' || state === 'dead')) {
    ctx.globalAlpha = Math.min(1, flash / 20);
    ctx.fillStyle = '#ff8a8a'; ctx.textAlign = 'center'; ctx.font = 'bold 34px sans-serif';
    ctx.fillText('La vasija se ha roto', VW / 2, VH / 2);
    ctx.globalAlpha = 1;
  }

  ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(8, 6, 460, 28);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText(`Nivel ${lvl + 1}/${LEVELS.length}: ${L.name}  ·  Orbes ${got}/${total}  ·  Muertes ${deaths}`, 16, 26);
  if (got === total) { ctx.fillStyle = '#ffe066'; ctx.fillText('¡Llega al banco! →', 16, VH - 14); }
  if (failed) { ctx.fillStyle = '#ff8080'; ctx.fillText('(no se pudo cargar el sprite de la vasija)', 16, VH - 14); }
  ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.font = '13px sans-serif'; ctx.textAlign = 'right';
  ctx.fillText(`P: espadazo  ·  M: ${muted ? 'activar sonido' : 'silenciar'}`, VW - 12, VH - 14);
  ctx.textAlign = 'left';

  if (state === 'next' || state === 'win') {
    ctx.fillStyle = 'rgba(0,0,0,.65)'; ctx.fillRect(0, 0, VW, VH);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = state === 'win' ? 'bold 32px sans-serif' : 'bold 40px sans-serif';
    ctx.fillText(state === 'win' ? 'Tu camino ha llegado a su fin' : '¡Nivel completado!', VW / 2, VH / 2 - 10);
    ctx.font = '20px sans-serif';
    ctx.fillText(state === 'win' ? `Muertes: ${deaths} · Presiona Enter para jugar de nuevo` : 'Cargando siguiente nivel...', VW / 2, VH / 2 + 30);
  }
}

// ===================== Controles y bucle principal ====================
addEventListener('keydown', e => {
  audioInit();
  keys[e.code] = true;
  if (e.code === 'KeyR' && state === 'play') respawn();
  if (e.code === 'KeyM') muted = !muted;
  if (e.code === 'KeyP' && !e.repeat) startAttack();
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', e => keys[e.code] = false);
addEventListener('pointerdown', audioInit);

// Paso fijo de 60 actualizaciones por segundo: la física y las plataformas
// van igual en monitores de 60, 120 o 144 Hz.
load(0);
let last = performance.now(), acc = 0;
const STEP = 1000 / 60;
(function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= STEP) { update(); acc -= STEP; }
  draw();
  requestAnimationFrame(loop);
})(performance.now());

</script>
</body>
</html>
